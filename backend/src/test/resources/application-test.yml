spring:
  datasource:
    url: jdbc:h2:mem:perf-a7;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
